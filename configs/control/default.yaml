# Steering law. Turns p(right_hand) into a continuous turn rate.
#
# The classifier output is a dial, not a switch: the dead zone in the middle
# gives proportional turning, and an idle gate supplies the do-nothing state.

# Smoothing time constant. ~400 ms trades responsiveness against jitter; at a
# 10 Hz update rate this averages roughly four windows. Also applied to the
# engagement signal from the idle gate.
ema_tau_s: 0.4

# Fallback only. `eegbot.decoding.calibrate` fits this per subject from their
# idle block and should override it in practice -- a hardcoded dead zone is
# wrong for almost everyone.
dead_zone: 0.25

# Upper bound on the calibrated dead zone. Calibration only sees idle data, so
# without this it will widen the dead zone until the subject can barely issue a
# command -- it has no way to observe that cost. Past ~0.6 the control is
# unusable no matter how quiet it looks at rest.
max_dead_zone: 0.60

# What the calibrator optimises for. Both criteria must hold, because they
# catch different failures: the onset rate catches a twitchy decoder, and the
# duty cycle catches one stuck permanently off-center. A latched decoder
# produces exactly ONE onset for a whole idle block -- an excellent-looking
# onset rate -- while steering continuously.
target_false_activation_hz: 0.05   # at most one spurious activation per 20 s
max_idle_active_fraction: 0.05     # at most 5% of resting time spent steering

# === Idle gate ===
#
# A 2-class decoder has no way to say "neither", so it stays confident even at
# rest and the dead zone alone cannot produce a usable idle state. The gate
# (eegbot.decoding.idle) answers the orthogonal question -- imagining or not? --
# and suppresses commands when the answer is no.
#
# Two thresholds, not one: engagement must clearly clear the upper bound to
# start commands and fall below the lower one to stop them. A single threshold
# chatters whenever engagement hovers near it, which shows up as a burst of
# brief false activations.
engagement_threshold: 0.60   # smoothed p(engaged) required to start
engagement_release: 0.40     # smoothed p(engaged) below which commands stop

# Cap on per-tick change in the normalized command. At 10 Hz this means a full
# -1 -> +1 reversal takes ~1.3 s, which reads as deliberate rather than twitchy.
# Also applies when the gate disengages, so stopping decelerates smoothly.
max_slew_per_tick: 0.15

# Normalized command -> turn rate (rad/s). Tune against the actual robot later.
turn_rate_gain: 1.0
