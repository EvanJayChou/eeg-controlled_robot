# Core conda environment for eeg-controlled_robot.
#
#   conda env create -f environment.yml
#   conda activate eegbot
#   pip install -e .
#
# This env covers everything except live streaming and cue presentation:
# dataset harmonization, signal processing, decoding, evaluation, offline
# replay, and the full test suite all run here.
#
# Two extras are deliberately NOT in this file, because both are fragile
# installs on Windows and neither is needed by someone doing analysis:
#
#   Streaming (real headset):   conda install -c conda-forge liblsl
#                               pip install -e ".[stream]"
#   Recording machine (cues):   pip install -e ".[session]"
#
# Keeping them out means a broken PsychoPy wheel cannot block the whole team.
name: eegbot
channels:
  - conda-forge
  # `nodefaults` keeps the solve inside conda-forge even when a user's .condarc
  # lists `defaults`. Mixing the two channels is a well-known source of
  # multi-hour solves and mismatched binaries on Windows.
  - nodefaults
dependencies:
  - python=3.11

  # === Scientific core ===
  - numpy>=1.26
  - scipy>=1.11
  - pandas>=2.1
  - scikit-learn>=1.4
  - matplotlib>=3.8
  - pyyaml>=6.0
  - joblib>=1.3
  - tabulate>=0.9          # pandas.to_markdown, used by the evaluation reports

  # === EEG ===
  - mne>=1.6

  # === Dev ===
  - pytest>=8.0
  - pytest-cov
  - ruff>=0.4
  - mypy>=1.9
  - ipykernel
  - jupyterlab

  - pip
  - pip:
      - pyriemann>=0.12     # covariance / tangent space / recentering
      - moabb>=1.1          # Lee2019 loader

# Deep-learning extras live in environment-dl.yml (not yet needed).
# Nobody should have to install CUDA to run a logistic regression.
